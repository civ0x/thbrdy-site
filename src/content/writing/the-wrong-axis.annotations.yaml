  - key: constitutional-ai
    pattern: "Constitutional AI"
    section: "03"
    title: "Claude's Constitution"
    authors: "Anthropic"
    year: 2024
    venue: "Anthropic"
    url: "https://www.anthropic.com/research/claudes-constitution"
    summary: >
      Natural-language principles governing model behavior, with traceable
      chain-of-thought reasoning. The constitution is published and
      contestable — a legibility choice with structural parallels to how
      Scholion surfaces the dependency structure of scientific claims.
    context: >
      The essay uses Constitutional AI as the concrete example of legible
      values encoding, contrasted with OpenAI's approach of citing existing
      laws — making the values invisible and uncontestable.

  - key: ball-republic-dying
    pattern: "recent essay"
    section: "03"
    title: "Clawed"
    authors: "Dean Ball"
    year: 2026
    venue: "Hyperdimensional"
    url: "https://www.hyperdimensional.co/p/clawed"
    summary: >
      Ball describes the American republic's trajectory not as decline but
      as a phase transition — governance by durable institutional process
      giving way to governance by executive fiat, with advanced AI deeply
      intertwined in whatever comes next. He uses the Anthropic-Pentagon
      standoff as his focal case.
    context: >
      Critical to the essay's argument: Ball's own writing undermines
      the adaptive governance framework he defended in the Anti-Debate.
      If the institutions are in hospice, adaptive governance has no
      medium to adapt through.


