# ──────────────────────────────────────────────────────────────────────
# The Wrong Axis — Annotation Companion File
# Essay: "The Wrong Axis"
# Generated: 2026-03-10
# ──────────────────────────────────────────────────────────────────────
#
# Three annotation modes:
#   terms:      Domain vocabulary. Author-written definitions.
#   references: Papers, books, reports. AI-generated summaries, author-reviewed.
#   links:      External URLs with curated metadata.
#
# Shared terms (reusable across essays) are tagged: shared: true
#
# Matching: explicit markers in MDX. The "pattern" field identifies
# the text to annotate. Annotate first substantive usage unless noted.
# ──────────────────────────────────────────────────────────────────────

terms:

  - key: oakeshott
    pattern: "Michael Oakeshott"
    section: intro
    shared: false
    definition: >
      British political philosopher (1901–1990). His central claim:
      governance is not the pursuit of a destination but the activity of
      attending to arrangements — "keeping afloat on an even keel."
      Rationalist planning, in his view, mistakes a map for the territory.

  - key: redundancy-engineering
    pattern: "Redundancy engineering"
    section: "01"
    shared: true
    definition: >
      Designing systems so that no single failure point is catastrophic.
      In governance, this means layering multiple independent coordination
      mechanisms rather than relying on any one institution. See also the
      coordination architecture in "The Valley of Death Is a Legibility
      Problem."

  - key: palantir-ontology
    pattern: "Palantir's Ontology layer"
    section: "02"
    shared: false
    definition: >
      Palantir's core data integration technology. It creates a unified
      semantic model across incompatible databases — mapping entities,
      relationships, and events into a single searchable graph. The
      "ontology" refers to this shared schema, not to philosophy.
      Agencies that adopt it find their data structured around Palantir's
      proprietary mappings.

  - key: lattice
    pattern: "Lattice"
    section: "02"
    shared: false
    definition: >
      Anduril's AI command-and-control operating system. It connects
      autonomous platforms across domains (air, sea, ground, electronic
      warfare) into a single sensor-shooter network. Human authorization
      for lethal engagements is a software-configurable policy setting
      within Lattice, not a hardware constraint.

  - key: legibility
    pattern: "legible"
    section: "03"
    shared: true
    definition: >
      Capable of being read and evaluated by external parties. In
      governance, legibility is the precondition for accountability —
      you cannot contest what you cannot see. This is the same legibility
      problem that drives both Scholion's claim-dependency tracking and
      the technology transfer failures analyzed in "The Valley of Death
      Is a Legibility Problem."
    url: "/writing/valley-of-death/"
    urlLabel: "Read essay"


references:

