    pattern: "*AI 2027*"
    section: intro
    title: "AI 2027"
    authors: "Daniel Kokotajlo et al."
    year: 2026
    venue: "AI Futures Project"
    url: "https://ai-2027.com"
    summary: >
      A detailed forecast of AI development trajectories through 2027,
      authored by the AI Futures Project. An independent evaluation scored
